name: Android APK

# Builds a small Android app that opens your hosted Story Factory.
# Set the address first: repo Settings > Secrets and variables > Actions > Variables > New repository variable, name SERVER_URL,
# value your site's address (for example https://story.example.com). With no SERVER_URL the app asks for the address when it opens.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the Android project
        working-directory: android-app
        run: |
          node scripts/configure.js
          npm install
          npx cap add android
          # plain http:// is only allowed when no fixed address was set (the address screen can then take any server)
          if ! grep -q '"url"' capacitor.config.json; then
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          fi
          # download handler + icons
          cp scripts/MainActivity.java android/app/src/main/java/com/storyfactory/app/MainActivity.java
          pip install pillow
          python scripts/make_icons.py android/app/src/main/res ../frontend/icons/icon-512.png
          npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check the APK
        run: |
          APK=android-app/android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^package:|uses-permission: name='android.permission.INTERNET'|application-label:" 
          "$AAPT" dump badging "$APK" | grep -q "android.permission.INTERNET"
          unzip -p "$APK" assets/capacitor.config.json | python3 -c "import json,sys; c=json.load(sys.stdin)['server']; print('opens:', c.get('url') or '(address screen)')"

      - name: Rename
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Story-Factory.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Story-Factory-APK
          path: Story-Factory.apk

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Story-Factory.apk
