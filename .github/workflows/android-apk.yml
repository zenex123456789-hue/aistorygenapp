name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          # allow http:// servers (a PC on your Wi-Fi or Tailscale)
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          # download handler + icons
          cp scripts/MainActivity.java android/app/src/main/java/com/storyfactory/app/MainActivity.java
          pip install pillow
          python scripts/make_icons.py android/app/src/main/res ../frontend/icons/icon-512.png
          npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Story-Factory.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Story-Factory-APK
          path: Story-Factory.apk

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Story-Factory.apk
