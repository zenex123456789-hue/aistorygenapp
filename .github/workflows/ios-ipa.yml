name: iPhone IPA (sideload)

# Builds an UNSIGNED iPhone app file (.ipa) that opens your hosted Story Factory.
# Apple only runs signed apps, so friends install it with a free sideloading tool (Sideloadly or AltStore), which signs it with their own Apple ID.
# Set the address first: repo Settings > Secrets and variables > Actions > Variables > New repository variable, name SERVER_URL.
# Note: macOS build minutes count extra on private repositories, so run this only when you need it.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create the iOS project
        working-directory: android-app
        run: |
          node scripts/configure.js
          npm install
          npx cap add ios
          pip install pillow
          python scripts/make_ios_icon.py ios/App/App/Assets.xcassets/AppIcon.appiconset ../frontend/icons/maskable-512.png
          # plain http:// (typed into the address screen) is only allowed when no fixed address was set
          if ! grep -q '"url"' capacitor.config.json; then
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/App/App/Info.plist
          fi
          npx cap sync ios

      - name: Build (unsigned)
        working-directory: android-app/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -25

      - name: Package the .ipa
        run: |
          APP=$(ls -d android-app/ios/App/build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "app bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Story-Factory.ipa Payload
          ls -l Story-Factory.ipa

      - name: Check the .ipa
        run: |
          rm -rf check && mkdir check && unzip -q Story-Factory.ipa -d check
          APP=$(ls -d check/Payload/*.app | head -1)
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|CFBundleName|MinimumOSVersion"
          lipo -info "$APP/$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          test -f "$APP/capacitor.config.json"
          python3 -c "import json,sys; c=json.load(open(sys.argv[1]))['server']; print('opens:', c.get('url') or '(address screen)')" "$APP/capacitor.config.json"
          ls "$APP" | grep -E "AppIcon" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Story-Factory-IPA
          path: Story-Factory.ipa

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Story-Factory.ipa
