name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # needed to attach the installer to a release on tag builds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview

      - name: Download FFmpeg (GPL build with libx264 + libass)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffsrc
          $ff = Get-ChildItem ffsrc -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $root = $ff.Directory.Parent.FullName
          New-Item -ItemType Directory -Force ffmpeg-bundle | Out-Null
          Copy-Item (Join-Path $ff.Directory.FullName "ffmpeg.exe")  ffmpeg-bundle\
          Copy-Item (Join-Path $ff.Directory.FullName "ffprobe.exe") ffmpeg-bundle\
          Copy-Item (Join-Path $root "LICENSE") ffmpeg-bundle\LICENSE.txt -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $root "README.txt") ffmpeg-bundle\README.txt -ErrorAction SilentlyContinue
          & ffmpeg-bundle\ffmpeg.exe -hide_banner -encoders | Select-String libx264
          & ffmpeg-bundle\ffmpeg.exe -hide_banner -filters  | Select-String subtitles

      # A release build takes its version number from the tag (v0.2.1 -> 0.2.1), so the app always knows which version it is.
      - name: Stamp the version from the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -match '^\d+(\.\d+){0,2}$') {
            Set-Content -Path backend\version.py -Value ('VERSION = "' + $ver + '"') -Encoding utf8
            Get-Content backend\version.py
          } else { Write-Host "Tag $ver is not a plain version number: leaving the version as it is." }

      - name: Build the app (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name AIStoryFactory --icon installer/app.ico
          --add-data "frontend;frontend" --add-data "assets;assets" --add-data "library;library" --add-data "CHANGELOG.md;."
          --collect-submodules backend --collect-all webview
          desktop.py

      - name: Add FFmpeg next to the app
        shell: pwsh
        run: Copy-Item ffmpeg-bundle dist\AIStoryFactory\ffmpeg -Recurse

      # Optional: bake the group's shared keys into this build. Add them under Settings > Secrets and variables > Actions
      # (names ANTHROPIC_API_KEY and ELEVENLABS_API_KEY, and optionally UPDATE_TOKEN, a read-only token for the in-app Releases list). Anyone who has the installer can extract them, so this only
      # happens while the repository is PRIVATE; on a public repository the keys are never embedded.
      - name: Add shared API keys (optional)
        shell: pwsh
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if ($env:REPO_PRIVATE -ne "true") {
            Write-Host "Repository is not private: NOT embedding any keys."
            exit 0
          }
          $lines = @()
          if ($env:ANTHROPIC_API_KEY)  { $lines += "ANTHROPIC_API_KEY=$($env:ANTHROPIC_API_KEY)" }
          if ($env:ELEVENLABS_API_KEY) { $lines += "ELEVENLABS_API_KEY=$($env:ELEVENLABS_API_KEY)" }
          # optional: a read-only GitHub token so the app can list and download releases from this private repository
          if ($env:UPDATE_TOKEN)       { $lines += "SF_UPDATE_TOKEN=$($env:UPDATE_TOKEN)" }
          if ($lines.Count -eq 0) {
            Write-Host "No shared keys configured: building without them."
            exit 0
          }
          Set-Content -Path dist\AIStoryFactory\builtin.env -Value $lines -Encoding utf8
          Write-Host "Embedded $($lines.Count) shared key(s). Values are hidden."

      - name: Self-test the built app
        shell: pwsh
        env:
          SF_HOME: ${{ github.workspace }}\selftest-home
        run: |
          $p = Start-Process -FilePath "dist\AIStoryFactory\AIStoryFactory.exe" -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:SF_HOME\selftest.json"
          if (Test-Path "$env:SF_HOME\app.log") { Get-Content "$env:SF_HOME\app.log" -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not ($ver -match '^\d')) { $ver = "0.0.0-dev" }
          & $iscc "/DAppVersion=$ver" installer\AIStoryFactory.iss

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Story-Factory-Setup
          path: installer-out/AI-Story-Factory-Setup.exe

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-out/AI-Story-Factory-Setup.exe
