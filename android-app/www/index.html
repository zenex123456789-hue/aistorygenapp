<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff"><title>Story Factory</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#f4f1ff,#ffe9f3);font-family:system-ui,Roboto,sans-serif;color:#1d1b2e}
.c{background:#fff;border-radius:22px;padding:26px;width:min(380px,92vw);box-shadow:0 14px 44px #5b3df526}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#7c5cff,#ff5ca8);display:grid;place-items:center;color:#fff;font-size:28px;margin-bottom:12px}
h1{font-size:21px;margin:0 0 4px}p{margin:0 0 16px;color:#666;font-size:14px;line-height:1.4}
input{width:100%;padding:13px 14px;border:1.5px solid #d9d3f5;border-radius:12px;font-size:16px}
button{margin-top:10px;width:100%;padding:13px;border:0;border-radius:12px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,#7c5cff,#ff5ca8)}
button.ghost{background:#efeaff;color:#4a35c9}.msg{min-height:20px;margin-top:10px;font-size:13.5px;color:#555}.err{color:#c0264b}
.hint{margin-top:14px;font-size:12.5px;color:#777;line-height:1.45}
</style></head><body><div class="c">
<div class="logo">✦</div><h1>Story Factory</h1>
<p id="lead">Enter the address of the Story Factory server, for example the PC that is running it.</p>
<div id="form"><input id="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="192.168.1.20:8000">
<button id="go">Connect</button></div>
<div id="auto" style="display:none"><button class="ghost" id="chg">Change server</button></div>
<div class="msg" id="msg"></div>
<div class="hint">Your PC and phone must be on the same Wi-Fi, or both on Tailscale. Tapping Back inside the app returns here, so you can switch server.</div>
</div>
<script>
const KEY = "sf_server", $ = (id) => document.getElementById(id);
const norm = (v) => { v = (v || "").trim(); if (!v) return ""; if (!/^https?:\/\//i.test(v)) v = "http://" + v; return v.replace(/\/+$/, ""); };
async function reachable(u) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 6000);
  try { await fetch(u + "/manifest.webmanifest", { mode: "no-cors", signal: c.signal }); return true; }
  catch { return false; } finally { clearTimeout(t); }
}
function msg(t, bad) { $("msg").textContent = t; $("msg").className = "msg" + (bad ? " err" : ""); }
async function connect(u) {
  msg("Connecting to " + u + " …");
  if (!(await reachable(u))) { msg("Can't reach " + u + ". Is the app running on that PC, and are you on the same network?", true); return false; }
  localStorage.setItem(KEY, u); location.href = u; return true;
}
$("go").onclick = () => { const u = norm($("url").value); if (!u) return msg("Type the server address first.", true); connect(u); };
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
$("chg").onclick = () => { cancelled = true; $("auto").style.display = "none"; $("form").style.display = ""; $("url").value = localStorage.getItem(KEY) || ""; msg(""); };
let cancelled = false;
const saved = localStorage.getItem(KEY);
if (saved) {
  $("form").style.display = "none"; $("auto").style.display = ""; $("lead").textContent = "Opening " + saved;
  setTimeout(async () => { if (cancelled) return; if (!(await connect(saved))) { $("auto").style.display = "none"; $("form").style.display = ""; $("url").value = saved; } }, 1800);
}
</script></body></html>
